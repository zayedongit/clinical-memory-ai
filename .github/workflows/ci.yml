name: CI

on:
  push:
    branches: [main, clinical-memory-upgrade]
  pull_request:
  workflow_dispatch:

# Nothing here needs repository write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Backend: lint, unit tests, and the database tests against a real
  # PostgreSQL running the real migrations.
  #
  # No step is `continue-on-error`. Every gate here is one that, if it
  # fails, means something a patient's record depends on is broken.
  # ------------------------------------------------------------------ #
  backend:
    name: Backend (lint + tests + database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Matches the Supabase major version. The migrations are executed
        # against it exactly as written, so a migration that only works on the
        # live project fails here instead of shipping.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CMA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Placeholders so Settings validates. No real key is needed: every
      # external call is mocked at the HTTP boundary.
      SUPABASE_URL: https://ci.example.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group dev --group ml

      - name: Lint
        run: uv run ruff check .

      - name: Unit and integration tests
        run: uv run pytest -q --durations=10

      - name: Verify the database tests actually ran
        # These are skipped when CMA_TEST_DATABASE_URL is unset. A silent skip
        # would quietly remove the RLS and attestation guarantees from CI, so
        # the absence of a skip is asserted rather than assumed.
        run: |
          uv run pytest tests/db -q --no-header -rs 2>&1 | tee db.log
          if grep -q "skipped" db.log; then
            echo "::error::Database tests were skipped; the CI Postgres service is not reachable."
            exit 1
          fi

      - name: Red-flag escalation evaluation
        run: uv run python scripts/eval_red_flags.py --gate

      - name: Extraction and citation-grounding evaluation
        run: uv run python scripts/eval_extraction.py --gate

      - name: Risk model reproduces from the committed cohort
        # Retrains from the seeded synthetic cohort and fails if the exported
        # artefact would differ from the committed one, or if the pure-Python
        # inference path diverges from scikit-learn.
        run: |
          cp app/ml/risk_model.json /tmp/committed_model.json
          uv run --group ml python scripts/train_risk_model.py
          python - <<'PY'
          import json, sys
          committed = json.load(open("/tmp/committed_model.json"))
          rebuilt = json.load(open("app/ml/risk_model.json"))
          drift = [k for k in ("feature_order", "intercept", "coefficients", "calibration",
                               "operating_threshold")
                   if committed.get(k) != rebuilt.get(k)]
          if drift:
              print(f"::error::Committed risk model does not reproduce; differs in {drift}. "
                    "Re-run scripts/train_risk_model.py and commit the artefact.")
              sys.exit(1)
          print("Risk model reproduces exactly from the committed cohort.")
          PY

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: backend/eval/results/
          retention-days: 14

  # ------------------------------------------------------------------ #
  # Frontend: typecheck, lint, unit + component tests, production build.
  # ------------------------------------------------------------------ #
  frontend:
    name: Frontend (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm test

      - name: Build
        # Deliberately run with no Supabase credentials: building the project
        # must not require production secrets. The Supabase client is created
        # lazily so this stays true.
        run: pnpm run build

  # ------------------------------------------------------------------ #
  # Repository hygiene.
  # ------------------------------------------------------------------ #
  hygiene:
    name: Secrets and data hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::A .env file is tracked. Secrets must never be committed."
            exit 1
          fi

      - name: No credential-shaped strings in tracked files
        run: |
          # Deliberately narrow: patterns specific to the providers this project
          # uses, so it catches a real leak without drowning in false positives.
          PATTERN='(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|eyJhbGciOi[A-Za-z0-9_-]{20,}|service_role_key\s*[:=]\s*["'"'"'][^"'"'"']{20,})'
          if git ls-files -z \
             | grep -zZv -E '(pnpm-lock\.yaml|uv\.lock|\.png$|\.ico$|\.svg$|ci\.yml$)' \
             | xargs -0 grep -nIE "$PATTERN" 2>/dev/null; then
            echo "::error::A credential-shaped string is committed."
            exit 1
          fi
          echo "No credential-shaped strings found."

      - name: Evaluation data is labelled synthetic
        # A real transcript pasted in during debugging must not become a
        # committed dataset.
        run: |
          for f in backend/eval/datasets/extraction_gold.json backend/eval/red_flag_cases.json; do
            grep -qi 'synthetic' "$f" || { echo "::error::$f does not declare itself synthetic"; exit 1; }
          done
          echo "Evaluation datasets are labelled synthetic."

      - name: Whitespace errors
        run: git diff --check "$(git rev-list --max-parents=0 HEAD | tail -1)" HEAD
