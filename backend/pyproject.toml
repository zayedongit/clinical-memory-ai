[project]
name = "clinical-memory-ai-backend"
version = "1.0.0"
description = "Clinical Memory AI — FastAPI backend: scribe, clinical facts, decision-support proxy, analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.124.4,<1.0",
    "httpx>=0.28.1,<0.29",
    "pydantic-settings>=2.8.1,<3.0",
]

[project.optional-dependencies]
# Error tracking. Optional so the API runs without it; init_sentry() degrades
# to a warning when the DSN is set but the SDK is absent.
sentry = ["sentry-sdk>=2.63.0,<3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.0",
    "psycopg[binary]>=3.2",
    "respx>=0.22.0",
    "ruff>=0.15.20",
    "pypdf>=5.0",
]
# Offline only: data ingestion, model training, evaluation harnesses.
# Never imported by the served application — app/ml/risk_model.py does
# inference in pure Python from the exported coefficients.
ml = [
    "scikit-learn>=1.5,<2.0",
    "numpy>=1.26,<3.0",
]
ingest = [
    "openpyxl>=3.1.5,<4.0",
    "psycopg2-binary>=2.9.10,<3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the framework's idiom
    "RUF012",  # mutable class attrs without ClassVar — noisy for dataclass defaults
    "RUF001",  # ambiguous unicode in strings — we normalise smart quotes on purpose
    "RUF002",  # ambiguous unicode in docstrings — prose uses en dashes deliberately
    "RUF003",
    "BLE001",  # broad excepts are used deliberately and are commented where they are
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "db: requires a PostgreSQL instance (set CMA_TEST_DATABASE_URL)",
]

[tool.ruff.lint.per-file-ignores]
# Offline one-shot ingestion scripts: long SQL literals and a long-lived
# psycopg connection that is closed explicitly rather than with a context
# manager. Not worth restructuring; they run by hand, never in the API.
"scripts/ingest_*.py" = ["E501", "SIM115"]
"scripts/eval_red_flags.py" = ["SIM115"]
